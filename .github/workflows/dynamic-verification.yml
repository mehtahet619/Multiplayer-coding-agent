name: Dynamic Verification Executor
run-name: Agent2 dynamic verification / ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique verification run identifier
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit SHA to test
        required: true
        type: string
      test_cases:
        description: JSON array of generated test cases
        required: true
        type: string
      test_bundle:
        description: CommonJS test harness source
        required: true
        type: string
permissions:
  contents: read
  checks: write
concurrency:
  group: dynamic-verification-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile --ignore-scripts
          elif [ -f package-lock.json ]; then npm ci --ignore-scripts
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable
          elif [ -f package.json ]; then npm install --ignore-scripts
          else echo "No supported Node package manifest; cannot verify." >&2; exit 1; fi
      - name: Prepare generated test bundle
        env:
          TEST_CASES_JSON: ${{ inputs.test_cases }}
          TEST_BUNDLE_SOURCE: ${{ inputs.test_bundle }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const cases = JSON.parse(process.env.TEST_CASES_JSON);
          if (!Array.isArray(cases) || cases.length < 20 || cases.length > 30) throw new Error('Expected 20–30 generated test cases');
          fs.writeFileSync('.agent-test-cases.json', JSON.stringify(cases), { mode: 0o600 });
          fs.writeFileSync('.agent-generated-tests.cjs', process.env.TEST_BUNDLE_SOURCE, { mode: 0o600 });
          fs.writeFileSync('.agent-runner-wrapper.cjs', `
          const fs = require('node:fs');
          (async () => {
            const cases = JSON.parse(fs.readFileSync('.agent-test-cases.json', 'utf8'));
            const mod = require('./.agent-generated-tests.cjs');
            const fn = typeof mod === 'function' ? mod : mod.runTests;
            if (typeof fn !== 'function') throw new Error('Generated harness must export a function or runTests');
            const raw = await fn({ repositoryRoot: process.cwd(), testCases: cases });
            if (!Array.isArray(raw)) throw new Error('Harness did not return an array');
            const expected = new Set(cases.map(x => x.id));
            const seen = new Set();
            const results = [];
            for (const item of raw) {
              if (!item || typeof item.id !== 'string' || !expected.has(item.id) || seen.has(item.id) ||
                  typeof item.passed !== 'boolean' || typeof item.message !== 'string') {
                throw new Error('Harness returned malformed, duplicate, or unexpected test results');
              }
              seen.add(item.id);
              results.push({ id: item.id, passed: item.passed, message: item.message.slice(0, 2000) });
            }
            if (seen.size !== expected.size) throw new Error('Harness omitted generated test IDs');
            const failed = results.filter(x => !x.passed);
            process.stdout.write(JSON.stringify({ results, testCount: results.length, passedCount: results.length - failed.length, failedCount: failed.length }) + '\\n');
            if (failed.length) process.exitCode = 1;
          })().catch(error => {
            let cases = [];
            try { cases = JSON.parse(fs.readFileSync('.agent-test-cases.json', 'utf8')); } catch {}
            const message = String(error && error.stack || error).slice(0, 2000);
            if (Array.isArray(cases) && cases.length) {
              const results = cases.map(test => ({ id: test.id, passed: false, message: 'Harness execution error: ' + message }));
              process.stdout.write(JSON.stringify({ results, testCount: results.length, passedCount: 0, failedCount: results.length }) + '\\n');
            } else {
              console.error(message);
            }
            process.exitCode = 1;
          });
          `, { mode: 0o600 });
          chmod 644 .agent-test-cases.json .agent-generated-tests.cjs .agent-runner-wrapper.cjs
          NODE
      - name: Install dependencies in disposable container
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
          docker run --rm --network bridge --memory 2g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD:/workspace:rw" -w /workspace node:22-bookworm-slim sh -lc '
              if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile --ignore-scripts;
              elif [ -f package-lock.json ]; then npm ci --ignore-scripts;
              elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable --mode=skip-builds;
              elif [ -f package.json ]; then npm install --ignore-scripts;
              else echo "No supported package manifest; generated static/API tests may still run."; fi
            '
      - name: Execute Agent 2 tests in network-isolated container
        id: run_tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none --memory 2g --cpus 2 --pids-limit 256 \
            --read-only --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -v "$PWD:/workspace:ro" -w /workspace node:22-bookworm-slim \
            node .agent-runner-wrapper.cjs > /tmp/agent2-results.json
          TEST_EXIT=$?
          set -e
          TEST_EXIT_CODE="$TEST_EXIT" node <<'NODE'
          const fs = require('node:fs');
          const cases = JSON.parse(fs.readFileSync('.agent-test-cases.json', 'utf8'));
          let raw;
          try { const lines = fs.readFileSync('/tmp/agent2-results.json', 'utf8').split(/\r?\n/).filter(Boolean); raw = JSON.parse(lines[lines.length - 1]); } catch { raw = null; }
          const valid = raw && Array.isArray(raw.results) &&
            raw.testCount === cases.length && raw.results.length === cases.length &&
            raw.results.every(x => x && typeof x.id === 'string' && typeof x.passed === 'boolean' && typeof x.message === 'string') &&
            new Set(raw.results.map(x => x.id)).size === cases.length &&
            cases.every(c => raw.results.some(x => x.id === c.id));
          const results = valid ? raw.results : [];
          const failed = results.filter(x => !x.passed);
          const report = {
            runId: process.env.RUN_ID, candidateSha: process.env.CANDIDATE_SHA,
            executed: Boolean(valid), status: valid && failed.length === 0 && process.env.TEST_EXIT_CODE === '0' ? 'passed' : 'failed',
            testCount: cases.length, passedCount: results.filter(x => x.passed).length,
            failedCount: valid ? failed.length : cases.length,
            failures: valid ? failed.slice(0, 25).map(x => ({id:x.id,message:x.message.slice(0,1000)})) : [{id:'sandbox-execution',message:'Sandbox failed or returned an invalid/mismatched report.'}],
            summary: valid ? (failed.length ? failed.length + ' generated tests failed.' : 'All ' + cases.length + ' generated tests passed.') : 'Isolated execution did not produce a valid report.'
          };
          fs.writeFileSync('.agent-verification-report.json', JSON.stringify(report), { mode: 0o600 });
          console.log(JSON.stringify(report));
          if (report.status !== 'passed') process.exitCode = 1;
          NODE
      - name: Publish verification check
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TEST_STEP_OUTCOME: ${{ steps.run_tests.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('.agent-verification-report.json', 'utf8'));
            } catch {
              report = {
                runId: process.env.RUN_ID,
                candidateSha: process.env.CANDIDATE_SHA,
                executed: false,
                status: 'failed',
                testCount: 0,
                passedCount: 0,
                failedCount: 1,
                failures: [{id:'report-missing', message:'Test execution did not produce a valid report.'}],
                summary:'Verification failed closed: no valid report was produced.'
              };
            }
            const expectedName = 'Agent2 Dynamic Verification ' + process.env.RUN_ID;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: expectedName,
              head_sha: process.env.CANDIDATE_SHA,
              status: 'completed',
              conclusion: report.status === 'passed' && report.executed === true && process.env.TEST_STEP_OUTCOME === 'success' ? 'success' : 'failure',
              output: {
                title: report.summary || 'Dynamic verification result',
                summary: JSON.stringify(report, null, 2).slice(0, 60000),
                text: 'Executed on GitHub-hosted runner. Run ID: ' + process.env.RUN_ID
              }
            });
